<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TaskFlow Pro - Nguyễn Huy Hoàng</title>
</script><style>
:root{--bg:#f1f5f9;--panel:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--red:#dc2626;--amber:#d97706;--green:#16a34a}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#0f172a;color:#fff;padding:14px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
.owner{font-size:12px;opacity:.85;margin-top:2px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
button{border:none;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;background:var(--blue);color:#fff}
button.ghost{background:#334155}button.danger{background:var(--red)}
button.active{background:#16a34a}
button:hover{filter:brightness(1.08)}
.dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;padding:16px 20px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:22px}.stat span{color:var(--muted);font-size:12px}
.today-banner{display:none;margin:12px 20px 0;background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:12px 16px}
.today-banner.show{display:block}
.today-banner b{color:#1d4ed8}
.board{display:grid;grid-template-columns:repeat(3,minmax(280px,1fr));gap:16px;padding:16px 20px 28px}
.board.today-mode{grid-template-columns:1fr}
.column{background:#e2e8f0;border-radius:14px;padding:12px;display:flex;flex-direction:column;min-height:60vh}
.board.today-mode .column{min-height:auto}
.column.drag-over{outline:3px dashed var(--blue);outline-offset:-4px;background:#dbeafe}
.column h2{margin:4px 4px 12px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.count{background:#64748b;color:#fff;border-radius:999px;padding:2px 9px;font-size:12px}
.task-list{flex:1;display:flex;flex-direction:column;gap:8px}
.task{background:#fff;border-radius:10px;padding:10px 12px;box-shadow:0 1px 3px rgba(15,23,42,.12);cursor:grab;border-left:5px solid var(--muted);position:relative}
.task.p-high{border-left-color:var(--red)}.task.p-medium{border-left-color:var(--amber)}.task.p-low{border-left-color:var(--green)}
.task.dragging{opacity:.45}
.task-title{font-weight:600;margin-bottom:4px;padding-right:26px}
.task-meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.badge{background:#f1f5f9;border-radius:999px;padding:2px 8px}
.badge.overdue{background:#fee2e2;color:#991b1b;font-weight:700}
.badge.today{background:#fef3c7;color:#92400e;font-weight:700}
.badge.done{background:#dcfce7;color:#166534}
.badge.file{background:#dbeafe;color:#1e40af}
.progress{height:5px;background:#e2e8f0;border-radius:999px;margin-top:7px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--blue)}
.task-close{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:6px;background:transparent;color:#94a3b8;font-size:16px;line-height:1;padding:0}
.task-close:hover{background:#fee2e2;color:var(--red);filter:none}
.empty{color:var(--muted);font-size:12px;text-align:center;padding:16px;border:1px dashed #94a3b8;border-radius:10px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;width:min(760px,100%);max-height:90vh;overflow:auto;padding:20px}
.modal h3{margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.full{grid-column:1/-1}
textarea{width:100%;min-height:80px;resize:vertical}
input.wide,textarea.wide{width:100%}
.section{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.section h4{margin:0 0 8px;font-size:14px}
.check{display:flex;gap:8px;align-items:center;margin:6px 0}
.check input[type=checkbox]{width:16px;height:16px}
.file-box{border:1px dashed #94a3b8;border-radius:10px;padding:10px;background:#f8fafc}
.file-row{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.note{font-size:11px;color:var(--muted);margin-top:6px}
.guide h4{margin:16px 0 6px;color:var(--blue)}
.guide ol,.guide ul{margin:0 0 10px 20px;padding:0}
.guide li{margin:4px 0;font-size:14px;line-height:1.5}
.guide table{width:100%;border-collapse:collapse;margin:8px 0 14px;font-size:13px}
.guide th,.guide td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
.guide th{background:#f1f5f9}
.guide .callout{background:#eff6ff;border-left:4px solid var(--blue);padding:10px 12px;border-radius:8px;font-size:14px}
@media(max-width:900px){.board{grid-template-columns:1fr}.column{min-height:auto}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div>

<div class="dashboard">

<main class="board" id="board">

<div class="overlay" id="overlay">
  <div class="modal">

      <div class="full"><label data-i18n="descriptionLabel"></label><textarea id="fDesc" class="wide"></textarea></div>

      <div><label data-i18n="assigneeLabel"></label><input id="fAssignee" type="text" data-i18n-placeholder="assigneePlaceholder" /></div>
      <div class="full"><label data-i18n="labelsLabel"></label><input id="fLabels" class="wide" type="text" data-i18n-placeholder="labelsPlaceholder" /></div>

      <div class="full section">

</div>

<div class="overlay" id="guideOverlay">

  </div>
</div>

<script>
"use strict";
const KEY="taskflow-pro-v6",LANG_KEY="taskflow-lang";
const OWNER="Nguyễn Huy Hoàng";
const $=id=>document.getElementById(id);
let tasks=load(),editingId=null,lang=localStorage.getItem(LANG_KEY)||"vi",pendingFiles=[],todayMode=false;

const I18N={
vi:{search:"Tìm kiếm công việc...",allPriorities:"Tất cả ưu tiên",allAssignees:"Tất cả người thực hiện",allLabels:"Tất cả nhãn",overdueOnly:"Quá hạn",newTaskPlaceholder:"Nhập công việc mới...",add:"Thêm",exportJson:"Xuất JSON",exportCsv:"Xuất CSV",importJson:"Nhập JSON",statTotal:"Tổng công việc",statOverdue:"Quá hạn",statDoneWeek:"Hoàn thành tuần này",statHigh:"Ưu tiên cao",colTodo:"Cần làm",colInProgress:"Đang làm",colDone:"Hoàn thành",taskDetails:"Chi tiết công việc",titleLabel:"Tiêu đề",descriptionLabel:"Mô tả",requesterLabel:"Người yêu cầu",customerLabel:"Khách hàng",requestDateLabel:"Ngày yêu cầu",dueDateLabel:"Ngày hết hạn",priorityLabel:"Ưu tiên",assigneeLabel:"Người thực hiện",labelsLabel:"Nhãn (cách nhau bằng dấu phẩy)",checklistLabel:"Checklist",newCheckPlaceholder:"Thêm việc con...",assigneePlaceholder:"Ví dụ: Nguyễn Huy Hoàng",labelsPlaceholder:"khẩn cấp, thiết kế",completionFiles:"Hồ sơ hoàn thành công việc",fileNote:"Có thể đính kèm nhiều file. File được lưu trong trình duyệt; nên dùng file nhỏ hơn 2–3 MB mỗi file.",deleteTask:"Xóa công việc",close:"Đóng",save:"Lưu",noTasks:"Không có công việc",due:"Hạn",priorityHigh:"Cao",priorityMedium:"Trung bình",priorityLow:"Thấp",completed:"Hoàn thành",subtasks:"việc con",deleteConfirm:"Bạn có chắc muốn xóa công việc này không?",removeFile:"Xóa file",download:"Tải xuống",importSuccess:"Đã nhập",tasksWord:"công việc.",invalidJson:"File JSON không hợp lệ.",guideButton:"Hướng dẫn làm việc",guideTitle:"Quy trình làm việc khi có nhiều việc dồn dập",todayButton:"Việc hôm nay",todayBannerTitle:"Chế độ Việc hôm nay",todayBannerText:"Đang hiển thị các việc ưu tiên cao, quá hạn hoặc hết hạn trong 3 ngày tới, sắp xếp theo thứ tự cần xử lý. Hãy hoàn thành từng việc trước khi nhận việc mới.",todayEmpty:"Không có việc nào cần xử lý trong 3 ngày tới.",todayBadge:"Hôm nay",soonBadge:"Sắp đến",priorityNames:{high:"Ưu tiên cao",medium:"Trung bình",low:"Ưu tiên thấp"},
guideHTML:`<div class="callout"><b>Nguyên tắc:</b> Không làm tất cả cùng lúc. Chọn ít việc quan trọng nhất, giới hạn số việc đang làm và theo dõi tiến độ mỗi ngày.</div>
<h4>1. Quy trình 15 phút mỗi sáng</h4>
<ol><li>Bấm <b>Việc hôm nay</b> để xem danh sách việc ưu tiên cao, quá hạn hoặc hạn trong 3 ngày tới.</li><li>Gom hết việc vào app: nhập mọi yêu cầu mới vào <b>Cần làm</b>.</li><li>Gán <b>Người yêu cầu, Khách hàng, Ngày yêu cầu, Ngày hết hạn</b>.</li><li>Đặt ưu tiên: chỉ chọn <b>Cao</b> cho việc vừa khẩn cấp vừa quan trọng.</li><li>Chọn tối đa <b>3 việc</b> cho hôm nay và kéo sang <b>Đang làm</b>.</li><li>Kết thúc ngày: kéo việc xong sang <b>Hoàn thành</b>, đính kèm hồ sơ kết quả và cập nhật checklist.</li></ol>
<h4>2. Cách xếp ưu tiên</h4>
<table><tr><th>Loại việc</th><th>Cách xử lý</th><th>Ví dụ</th></tr><tr><td>Khẩn cấp + quan trọng</td><td>Làm ngay hôm nay</td><td>Khách hàng cần báo cáo trong hôm nay</td></tr><tr><td>Quan trọng + chưa khẩn cấp</td><td>Đặt ngày hạn và lên lịch</td><td>Chuẩn bị đề xuất cho tuần sau</td></tr><tr><td>Khẩn cấp + ít quan trọng</td><td>Giao lại, rút gọn hoặc xử lý theo khung giờ</td><td>Trả lời yêu cầu hành chính</td></tr><tr><td>Không khẩn + không quan trọng</td><td>Xóa, hoãn hoặc gộp</td><td>Việc không có deadline và không tạo giá trị</td></tr></table>
<h4>3. Giới hạn “Đang làm”</h4>
<ul><li>Mỗi người chỉ nên có <b>1–3 việc</b> ở cột <b>Đang làm</b>.</li><li>Nếu cột <b>Đang làm</b> đã đầy, hoàn thành hoặc tạm dừng một việc trước khi nhận việc mới.</li></ul>
<h4>4. Theo dõi mỗi ngày</h4>
<ul><li>Dùng <b>Việc hôm nay</b> và bộ lọc <b>Quá hạn</b>.</li><li>Ưu tiên xử lý các việc <b>Cao</b>.</li><li>Việc lớn nên tách thành checklist nhỏ.</li><li>Kiểm tra <b>Hoàn thành tuần này</b> để báo cáo tiến độ.</li></ul>
<h4>5. Khi hoàn thành</h4>
<ul><li>Kéo công việc sang <b>Hoàn thành</b>.</li><li>Đính kèm file kết quả.</li><li>Kiểm tra checklist.</li><li>Thông báo cho người yêu cầu hoặc khách hàng.</li></ul>
<div class="callout">Nếu một việc quá lớn, hãy ghi <b>bước tiếp theo cụ thể</b> trong mô tả.</div>`},
en:{search:"Search tasks...",allPriorities:"All priorities",allAssignees:"All assignees",allLabels:"All labels",overdueOnly:"Overdue",newTaskPlaceholder:"Enter a new task...",add:"Add",exportJson:"Export JSON",exportCsv:"Export CSV",importJson:"Import JSON",statTotal:"Total tasks",statOverdue:"Overdue",statDoneWeek:"Completed this week",statHigh:"High priority",colTodo:"To Do",colInProgress:"In Progress",colDone:"Done",taskDetails:"Task details",titleLabel:"Title",descriptionLabel:"Description",requesterLabel:"Requested by",customerLabel:"Customer",requestDateLabel:"Request date",dueDateLabel:"Due date",priorityLabel:"Priority",assigneeLabel:"Assignee",labelsLabel:"Labels (comma-separated)",checklistLabel:"Checklist",newCheckPlaceholder:"Add a subtask...",assigneePlaceholder:"e.g. Nguyen Huy Hoang",labelsPlaceholder:"urgent, design",completionFiles:"Completion files",fileNote:"You can attach multiple files. Files are stored in your browser; keep each file under 2–3 MB.",deleteTask:"Delete task",close:"Close",save:"Save",noTasks:"No tasks",due:"Due",priorityHigh:"High",priorityMedium:"Medium",priorityLow:"Low",completed:"Completed",subtasks:"subtasks",deleteConfirm:"Are you sure you want to delete this task?",removeFile:"Remove",download:"Download",importSuccess:"Imported",tasksWord:"tasks.",invalidJson:"Invalid JSON file.",guideButton:"Work guideline",guideTitle:"How to manage a heavy workload",todayButton:"Today’s work",todayBannerTitle:"Today mode",todayBannerText:"Showing high-priority, overdue, or tasks due within the next 3 days, ordered by what to handle first.",todayEmpty:"No tasks need attention in the next 3 days.",todayBadge:"Today",soonBadge:"Due soon",priorityNames:{high:"High priority",medium:"Medium priority",low:"Low priority"},
guideHTML:`<div class="callout"><b>Principle:</b> Do not do everything at once. Choose the few most important tasks, limit work in progress, and review progress daily.</div>
<h4>1. 15-minute morning routine</h4>
<ol><li>Click <b>Today’s work</b> to see high-priority, overdue, or tasks due within the next 3 days.</li><li>Capture every new request in <b>To Do</b>.</li><li>Set <b>Requested by, Customer, Request date, Due date</b>.</li><li>Set priority: use <b>High</b> only for urgent and important work.</li><li>Choose a maximum of <b>3 tasks</b> for today and move them to <b>In Progress</b>.</li><li>At day end, move finished work to <b>Done</b>, attach result files, and update the checklist.</li></ol>
<h4>2. How to prioritize</h4>
<table><tr><th>Type of task</th><th>Action</th><th>Example</th></tr><tr><td>Urgent + important</td><td>Do today</td><td>Customer needs a report today</td></tr><tr><td>Important + not urgent</td><td>Schedule it with a due date</td><td>Prepare next week’s proposal</td></tr><tr><td>Urgent + less important</td><td>Delegate, simplify, or batch it</td><td>Administrative requests</td></tr><tr><td>Not urgent + not important</td><td>Delete, postpone, or combine</td><td>Work with no deadline or value</td></tr></table>
<h4>3. Limit “In Progress”</h4>
<ul><li>Each person should have only <b>1–3 tasks</b> in <b>In Progress</b>.</li><li>If the column is full, finish or pause a task before taking a new one.</li></ul>
<h4>4. Daily tracking</h4>
<ul><li>Use <b>Today’s work</b> and the <b>Overdue</b> filter.</li><li>Handle <b>High</b> priority tasks first.</li><li>Break large tasks into small checklist items.</li><li>Review <b>Completed this week</b> to report progress.</li></ul>
<h4>5. When completing work</h4>
<ul><li>Move the task to <b>Done</b>.</li><li>Attach the result file.</li><li>Confirm all checklist items are complete.</li><li>Notify the requester or customer.</li></ul>
<div class="callout">If a task is too large, write the <b>next concrete action</b> in the description.</div>`}
};
function t(k){return I18N[lang][k]}
function applyLanguage(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el=>el.placeholder=t(el.dataset.i18nPlaceholder));
  $("guideContent").innerHTML=t("guideHTML");
  $("lang").value=lang;$("todayBtn").classList.toggle("active",todayMode);
  render();
  if(editingId){const task=tasks.find(x=>x.id===editingId);if(task)renderFiles(task)}
}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return Array.isArray(d)?d:[]}catch(e){return[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(tasks))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function dateStr(offset){const d=new Date();d.setDate(d.getDate()+offset);return d.toISOString().slice(0,10)}
function today(){return dateStr(0)}
function isOverdue(task){return Boolean(task.due)&&task.due<today()&&task.column!=="done"}
function isToday(task){return Boolean(task.due)&&task.due===today()&&task.column!=="done"}
function isSoon(task){return Boolean(task.due)&&task.due>today()&&task.due<=dateStr(3)&&task.column!=="done"}
function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
function priorityRank(p){return p==="high"?0:p==="medium"?1:2}
function todayTasks(){
  return tasks.filter(x=>x.column!=="done"&&(x.priority==="high"||isOverdue(x)||isToday(x)||isSoon(x)))
    .sort(function(a,b){
      if(isOverdue(a)!==isOverdue(b))return isOverdue(a)?-1:1;
      if((a.due||"9999")!==(b.due||"9999"))return (a.due||"9999")<(b.due||"9999")?-1:1;
      return priorityRank(a.priority)-priorityRank(b.priority);
    });
}
function visibleTasks(){
  const q=$("search").value.toLowerCase(),p=$("filterPriority").value,a=$("filterAssignee").value,l=$("filterLabel").value,o=$("onlyOverdue").checked;
  let base=todayMode?todayTasks():tasks;
  return base.filter(function(task){
    const text=(task.title+" "+(task.description||"")).toLowerCase();
    if(q&&text.indexOf(q)===-1)return false;
    if(p&&task.priority!==p)return false;
    if(a&&task.assignee!==a)return false;
    if(l&&(task.labels||[]).indexOf(l)===-1)return false;
    if(o&&!isOverdue(task))return false;
    return true;
  });
}
function fillFilter(select,values,emptyText){
  const current=select.value;select.innerHTML="";
  const option=document.createElement("option");option.value="";option.textContent=emptyText;select.appendChild(option);
  values.forEach(v=>{const item=document.createElement("option");item.value=v;item.textContent=v;select.appendChild(item)});
  select.value=current;
}
function render(){
  const shown=visibleTasks(),board=$("board");
  board.classList.toggle("today-mode",todayMode);
  $("todayBanner").classList.toggle("show",todayMode);
  const columns=todayMode?["todo","inprogress"]:["todo","inprogress","done"];
  document.querySelectorAll(".column").forEach(col=>{col.style.display=columns.indexOf(col.dataset.column)===-1?"none":"flex"});
  columns.forEach(function(column){
    const list=$(column);list.innerHTML="";
    const items=shown.filter(x=>x.column===column);
    if(!items.length){const empty=document.createElement("div");empty.className="empty";empty.textContent=todayMode?t("todayEmpty"):t("noTasks");list.appendChild(empty)}
    items.forEach(function(task){
      const card=document.createElement("div");card.className="task p-"+(task.priority||"low");card.draggable=true;card.dataset.id=task.id;
      const checklist=task.checklist||[],doneCount=checklist.filter(x=>x.done).length;
      let meta="";
      if(task.requester)meta+='<span class="badge">'+t("requesterLabel")+": "+esc(task.requester)+"</span>";
      if(task.customer)meta+='<span class="badge">'+t("customerLabel")+": "+esc(task.customer)+"</span>";
      if(task.requestDate)meta+='<span class="badge">'+t("requestDateLabel")+": "+esc(task.requestDate)+"</span>";
      if(task.due)meta+='<span class="badge '+(isOverdue(task)?"overdue":"")+'">'+t("due")+": "+esc(task.due)+"</span>";
      if(isToday(task))meta+='<span class="badge today">'+t("todayBadge")+"</span>";
      else if(isSoon(task))meta+='<span class="badge today">'+t("soonBadge")+"</span>";
      if(task.assignee)meta+='<span class="badge">'+esc(task.assignee)+"</span>";
      if(task.priority)meta+='<span class="badge">'+t("priorityNames")[task.priority]+"</span>";
      (task.labels||[]).forEach(x=>meta+='<span class="badge">#'+esc(x)+"</span>");
      if(task.column==="done")meta+='<span class="badge done">'+t("completed")+"</span>";
      const files=task.files||[];
      if(files.length)meta+='<span class="badge file">📎 '+files.length+"</span>";
      let progress="";
      if(checklist.length){const percent=Math.round(doneCount/checklist.length*100);progress='<div class="progress"><i style="width:'+percent+'%"></i></div><div class="task-meta">'+doneCount+"/"+checklist.length+" "+t("subtasks")+"</div>"}
      card.innerHTML='<div class="task-title">'+esc(task.title)+'</div><div class="task-meta">'+meta+"</div>"+progress;
      const close=document.createElement("button");close.type="button";close.className="task-close";close.textContent="×";close.title=t("deleteTask");
      close.addEventListener("click",function(e){e.stopPropagation();if(confirm(t("deleteConfirm"))){tasks=tasks.filter(x=>x.id!==task.id);save();render()}});
      card.appendChild(close);
      card.addEventListener("click",function(){openEditor(task.id)});
      card.addEventListener("dragstart",function(e){e.dataTransfer.setData("text/plain",task.id);e.dataTransfer.effectAllowed="move";card.classList.add("dragging")});
      card.addEventListener("dragend",function(){card.classList.remove("dragging")});
      list.appendChild(card);
    });
    $("c-"+column).textContent=tasks.filter(x=>x.column===column).length;
  });
  const weekStart=new Date();weekStart.setHours(0,0,0,0);weekStart.setDate(weekStart.getDate()-weekStart.getDay()+1);
  $("statTotal").textContent=tasks.length;
  $("statOverdue").textContent=tasks.filter(isOverdue).length;
  $("statDoneWeek").textContent=tasks.filter(x=>x.column==="done"&&x.completedAt&&new Date(x.completedAt)>=weekStart).length;
  $("statHigh").textContent=tasks.filter(x=>x.priority==="high"&&x.column!=="done").length;
  const people=[],labels=[];
  tasks.forEach(function(task){if(task.assignee&&people.indexOf(task.assignee)===-1)people.push(task.assignee);(task.labels||[]).forEach(x=>{if(labels.indexOf(x)===-1)labels.push(x)})});
  fillFilter($("filterAssignee"),people,t("allAssignees"));fillFilter($("filterLabel"),labels,t("allLabels"));
}
function addTask(){
  const title=$("newTask").value.trim();if(!title)return;
  tasks.push({id:uid(),title:title,column:"todo",priority:"medium",description:"",requester:"",customer:"",requestDate:"",due:"",assignee:OWNER,labels:[],checklist:[],files:[],createdAt:new Date().toISOString()});
  $("newTask").value="";save();render();
}
function openEditor(id){
  const task=tasks.find(x=>x.id===id);if(!task)return;
  editingId=id;pendingFiles=[];
  $("fTitle").value=task.title;$("fDesc").value=task.description||"";
  $("fRequester").value=task.requester||"";$("fCustomer").value=task.customer||"";
  $("fRequestDate").value=task.requestDate||"";$("fDue").value=task.due||"";
  $("fPriority").value=task.priority||"medium";$("fAssignee").value=task.assignee||"";
  $("fLabels").value=(task.labels||[]).join(", ");$("newCheck").value="";
  renderChecklist(task);renderFiles(task);$("overlay").classList.add("open");
}
function renderChecklist(task){
  const box=$("checklist");box.innerHTML="";
  (task.checklist||[]).forEach(function(item,index){
    const row=document.createElement("div");row.className="check";
    const checkbox=document.createElement("input");checkbox.type="checkbox";checkbox.checked=Boolean(item.done);
    const text=document.createElement("span");text.style.flex="1";text.textContent=item.text;
    const remove=document.createElement("button");remove.type="button";remove.className="ghost";remove.textContent=lang==="vi"?"Xóa":"Delete";
    checkbox.addEventListener("change",e=>{task.checklist[index].done=e.target.checked;save();render()});
    remove.addEventListener("click",()=>{task.checklist.splice(index,1);save();render();renderChecklist(task)});
    row.appendChild(checkbox);row.appendChild(text);row.appendChild(remove);box.appendChild(row);
  });
}
function renderFiles(task){
  const box=$("fileList");box.innerHTML="";
  const files=(task.files||[]).concat(pendingFiles);
  files.forEach(function(file,index){
    const row=document.createElement("div");row.className="file-row";
    const name=document.createElement("span");name.style.flex="1";name.textContent="📎 "+file.name;
    const download=document.createElement("button");download.type="button";download.className="ghost";download.textContent=t("download");
    download.addEventListener("click",()=>{const link=document.createElement("a");link.href=file.data;link.download=file.name;link.click()});
    const remove=document.createElement("button");remove.type="button";remove.className="danger";remove.textContent=t("removeFile");
    remove.addEventListener("click",()=>{
      const existing=(task.files||[]).length;
      if(index<existing)task.files.splice(index,1);else pendingFiles.splice(index-existing,1);
      save();renderFiles(task);render();
    });
    row.appendChild(name);row.appendChild(download);row.appendChild(remove);box.appendChild(row);
  });
}
function handleFiles(event){
  const task=tasks.find(x=>x.id===editingId);if(!task)return;
  Array.from(event.target.files).forEach(function(file){
    const reader=new FileReader();
    reader.onload=function(){pendingFiles.push({name:file.name,type:file.type,size:file.size,data:reader.result});renderFiles(task)};
    reader.readAsDataURL(file);
  });
  event.target.value="";
}
function saveEditor(){
  const task=tasks.find(x=>x.id===editingId);if(!task)return;
  const title=$("fTitle").value.trim();if(title)task.title=title;
  task.description=$("fDesc").value;task.requester=$("fRequester").value.trim();task.customer=$("fCustomer").value.trim();
  task.requestDate=$("fRequestDate").value;task.due=$("fDue").value;task.priority=$("fPriority").value;
  task.assignee=$("fAssignee").value.trim();
  task.labels=$("fLabels").value.split(",").map(x=>x.trim()).filter(Boolean);
  task.files=(task.files||[]).concat(pendingFiles);pendingFiles=[];
  save();render();$("overlay").classList.remove("open");
}
function exportData(type){
  let content,mime,filename;
  if(type==="json"){content=JSON.stringify(tasks,null,2);mime="application/json";filename="taskflow-backup.json"}
  else{
    const rows=[["Title","Column","Priority","Requester","Customer","Request date","Due","Assignee","Labels","Description","Checklist","Files"]];
    tasks.forEach(function(task){rows.push([task.title,task.column,task.priority,task.requester,task.customer,task.requestDate,task.due,task.assignee,(task.labels||[]).join("|"),task.description,(task.checklist||[]).map(x=>(x.done?"[x] ":"[ ] ")+x.text).join(" | "),(task.files||[]).map(x=>x.name).join(" | ")])});
    content=rows.map(row=>row.map(v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"').join(",")).join("\n");
    mime="text/csv";filename="taskflow-export.csv";
  }
  const link=document.createElement("a");link.href=URL.createObjectURL(new Blob(["\ufeff"+content],{type:mime}));link.download=filename;link.click();
}
function importData(file){
  const reader=new FileReader();
  reader.onload=function(){try{const data=JSON.parse(reader.result);if(!Array.isArray(data))throw new Error("invalid");tasks=data;save();render();alert(t("importSuccess")+" "+data.length+" "+t("tasksWord"))}catch(e){alert(t("invalidJson"))}};
  reader.readAsText(file);
}
document.querySelectorAll(".column").forEach(function(column){
  const name=column.dataset.column;
  column.addEventListener("dragover",e=>{e.preventDefault();column.classList.add("drag-over")});
  column.addEventListener("dragleave",()=>column.classList.remove("drag-over"));
  column.addEventListener("drop",e=>{
    e.preventDefault();column.classList.remove("drag-over");
    const id=e.dataTransfer.getData("text/plain"),task=tasks.find(x=>x.id===id);if(!task)return;
    task.column=name;if(name==="done")task.completedAt=new Date().toISOString();else delete task.completedAt;
    save();render();
  });
});
["search","filterPriority","filterAssignee","filterLabel","onlyOverdue"].forEach(id=>$(id).addEventListener("input",render));
$("lang").addEventListener("change",function(){lang=$("lang").value;localStorage.setItem(LANG_KEY,lang);applyLanguage()});
$("todayBtn").addEventListener("click",function(){todayMode=!todayMode;applyLanguage()});
$("guideBtn").addEventListener("click",()=>$("guideOverlay").classList.add("open"));
$("closeGuide").addEventListener("click",()=>$("guideOverlay").classList.remove("open"));
$("guideOverlay").addEventListener("click",e=>{if(e.target===$("guideOverlay"))$("guideOverlay").classList.remove("open")});
$("addBtn").addEventListener("click",addTask);
$("newTask").addEventListener("keydown",e=>{if(e.key==="Enter")addTask()});
$("closeModal").addEventListener("click",()=>$("overlay").classList.remove("open"));
$("saveTask").addEventListener("click",saveEditor);
$("deleteTask").addEventListener("click",function(){if(confirm(t("deleteConfirm"))){tasks=tasks.filter(x=>x.id!==editingId);save();render();$("overlay").classList.remove("open")}});
$("addCheck").addEventListener("click",function(){
  const task=tasks.find(x=>x.id===editingId),value=$("newCheck").value.trim();if(!task||!value)return;
  task.checklist=task.checklist||[];task.checklist.push({text:value,done:false});$("newCheck").value="";save();render();renderChecklist(task);
});
$("fileInput").addEventListener("change",handleFiles);
$("exportJson").addEventListener("click",()=>exportData("json"));
$("exportCsv").addEventListener("click",()=>exportData("csv"));
$("importBtn").addEventListener("click",()=>$("importFile").click());
$("importFile").addEventListener("change",e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=""});
$("overlay").addEventListener("click",e=>{if(e.target===$("overlay"))$("overlay").classList.remove("open")});
applyLanguage();
</script>
</body>
</html>
